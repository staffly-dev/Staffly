# NATS Server Configuration with Security

# Server information
server_name: "staffly-nats"
host: "0.0.0.0"
port: 4222

# Authorization
auth_token: "YOUR_SECURE_AUTH_TOKEN_HERE"

# TLS Configuration
tls {
  cert_file: "/etc/nats/certs/server.crt"
  key_file: "/etc/nats/certs/server.key"
  ca_file: "/etc/nats/certs/ca.crt"
  verify: true
}

# JetStream
jetstream {
  store_dir: "/data/jetstream"
  max_memory_store: 1GB
  max_file_store: 10GB
}

# Logging
log_file: "/data/logs/nats.log"
logtime: true
debug: false
trace: false

# Limits
max_connections: 1000
max_payload: 1MB
max_pending: 5MB
max_control_line: 512

# Security
no_system_account: false
system_account: "SYSTEM"

# Monitoring
http_port: 8222
server_tags: ["staffly", "production"]

# Clustering (if needed)
# cluster {
#   name: "staffly-cluster"
#   listen: "0.0.0.0:6222"
#   routes: [
#     "nats://server1:6222"
#     "nats://server2:6222"
#   ]
#   cluster_auth: "cluster_password"
# }

# Account-based security
accounts {
  SYSTEM: {
    users: [
      {
        user: "admin"
        password: "admin_password"
        permissions: {
          publish: ">"
          subscribe: ">"
        }
      }
    ]
  }
  
  API_GATEWAY: {
    users: [
      {
        user: "api-gateway"
        password: "gateway_password"
        permissions: {
          publish: [
            "hrms.*",
            "ats.*",
            "system.*"
          ]
          subscribe: [
            "hrms.*",
            "ats.*",
            "system.*"
          ]
        }
      }
    ]
  }
  
  HRMS: {
    users: [
      {
        user: "hrms-service"
        password: "hrms_password"
        permissions: {
          publish: [
            "hrms.response.*",
            "system.audit.*",
            "system.health.*"
          ]
          subscribe: [
            "hrms.request.*",
            "system.*"
          ]
        }
      }
    ]
  }
  
  ATS: {
    users: [
      {
        user: "ats-service"
        password: "ats_password"
        permissions: {
          publish: [
            "ats.response.*",
            "system.audit.*",
            "system.health.*"
          ]
          subscribe: [
            "ats.request.*",
            "system.*"
          ]
        }
      }
    ]
  }
}

# Stream permissions for JetStream
stream_permissions {
  hrms: {
    streams: ["hrms_*"]
    subjects: ["hrms.*"]
  }
  
  ats: {
    streams: ["ats_*"]
    subjects: ["ats.*"]
  }
  
  system: {
    streams: ["system_*"]
    subjects: ["system.*"]
  }
}
